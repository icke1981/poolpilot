<!doctype html><html lang='de'><head>
<meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>PoolPilot 2.3</title>
<link rel='manifest' href='manifest.webmanifest'>
<link rel='stylesheet' href='style.css'>
</head><body>
<div class='card'>
<h1>🏊 PoolPilot 2.3</h1>
<div class="status" id="status">

🟡 Letzte Messung wird geladen
</div>

<div class="dashboard">

<div class="box">

<h3>pH</h3>

<div id="phStatus">--</div>

</div>

<div class="box">

<h3>Chlor</h3>

<div id="chlorStatus">--</div>

</div>

<div class="box">

<h3>Temperatur</h3>

<div id="tempStatus">-- °C</div>

</div>

<div class="box">

<h3>Nächste Messung</h3>

<div id="nextMeasure">Heute</div>
</div>
</div>
<p><b>Pool:</b> 7.200 Liter</p>
  
<h3>Meine Produkte</h3>

<label>pH-Senker</label>

<select id="phMinus">

    <option value="cristal">Cristal pH-Minus</option>

    <option value="bayrol">Bayrol pH-Minus</option>

</select>

<label>pH-Heber</label>

<select id="phPlus">

    <option value="cristal">Cristal pH-Plus</option>

    <option value="bayrol">Bayrol pH-Plus</option>

</select>

<label>Schnellchlor</label>

<select id="chlorProduct">

    <option value="chloryte">Bayrol Chloryte</option>

    <option value="granulat">Chlorgranulat</option>

</select>

<label>Langzeitchlor</label>

<select id="multiTab">

    <option value="globalclean">GlobalClean Multitab</option>

    <option value="bayrol">Bayrol Complete</option>

</select>

<label>Datum</label><input id='date' type='date'>
<label>pH</label><input id='ph' type='number' step='0.1' value='7.2'>
<label>Freies Chlor (mg/l)</label><input id='chlor' type='number' step='0.1' value='1.0'>
<label>TA (mg/l)</label><input id='ta' type='number' value='100'>
<label>CYA (mg/l)</label><input id='cya' type='number' value='30'>
<label>Temperatur (°C)</label><input id='temp' type='number' value='25'>
<button onclick='check()'>Auswerten & Speichern</button>
<div id='result'></div>
<h2>Dosierungsempfehlung</h2>
<div id='dose'></div>
  
<div class="box">

    <h3>🌤 Wetter</h3>

    <div id="weatherTemp">-- °C</div>

    <div id="weatherText">Wird geladen...</div>

</div>

<h2>📅 Messhistorie</h2>

<div id="history"></div>
<h2>📈 Wasserwerte-Verlauf</h2>

<canvas id="chart"></canvas> 
 <script src=" https://cdn.jsdelivr.net/npm/chart.js"></script> 
</div>
<script src="app.js"></script>
</body>
</html>
