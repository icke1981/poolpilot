<!doctype html><html lang='de'><head>
<meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>PoolPilot 1.1</title>
<link rel='manifest' href='manifest.webmanifest'>
<link rel='stylesheet' href='style.css'>
</head><body>
<div class='card'>
<h1>🏊 PoolPilot 1.1</h1>
<p><b>Pool:</b> 7.200 Liter</p>

<label>Datum</label><input id='date' type='date'>
<label>pH</label><input id='ph' type='number' step='0.1' value='7.2'>
<label>Freies Chlor (mg/l)</label><input id='chlor' type='number' step='0.1' value='1.0'>
<label>Alkalinität TA (mg/l)</label><input id='ta' type='number' value='100'>
<label>Cyanursäure CYA (mg/l)</label><input id='cya' type='number' value='30'>
<label>Wassertemperatur (°C)</label><input id='temp' type='number' value='25'>

<button onclick='check()'>Auswerten & Speichern</button>
<div id='result'></div>
</div>
<script src='app.js'></script>
</body></html>
